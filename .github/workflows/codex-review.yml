# Independent code review of pull requests by OpenAI Codex
# (https://github.com/openai/codex-action), posted as a single PR comment.
#
# When it runs (deliberately NOT on every push, to avoid an endless
# push -> review -> fix -> push -> review loop):
# - automatically, once, when a PR is opened;
# - manually: Actions > Codex PR Review > Run workflow, enter the PR number.
#   That reviews the PR's latest head commit and re-checks the previous review.
# Pushes to an open PR (by you, Claude Code, Codex or anyone) only run CI.
#
# Security model:
# - Trigger is `pull_request` / `workflow_dispatch`, never `pull_request_target`.
# - PRs whose head branch lives in a fork are refused in both modes, so
#   OPENAI_API_KEY is never used on fork code. Dependabot PRs are skipped.
# - The `review` job holds OPENAI_API_KEY with read-only permissions; Codex runs
#   in the `:read-only` permission profile with `drop-sudo`, as the job's last
#   step, so it cannot modify code, push, or merge.
# - The `comment` job can only write PR comments (`pull-requests: write`); it has
#   no secret and runs no PR code. No job here has `contents: write`, so nothing
#   in this workflow can push or merge; branch protection on main also requires CI.
# - Review instructions come from the base branch, so a PR can't rewrite them.
#   PR title/body and the previous review are passed to Codex marked untrusted.
#
# Setup: repository secret OPENAI_API_KEY. Optional repository variables:
#   CODEX_MODEL             model name passed to Codex (empty = Codex default)
#   CODEX_ALLOW_BOT_USERS   comma-separated bot accounts allowed to trigger a review

name: Codex PR Review
# Fixed format: AGENTS.md counts manual re-reviews of a PR by this title.
run-name: Codex review of PR #${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review (reviews its latest commit)"
        required: true
        type: number

permissions: {}

# One review per PR at a time. A second request for the same PR waits instead of
# cancelling a review that is already being paid for.
concurrency:
  group: codex-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  review:
    name: Codex review
    # Automatic run: same-repository, non-Dependabot PRs only. Manual runs are
    # checked against the PR fetched from the API in "Resolve pull request".
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    # Not ubuntu-latest: on the Ubuntu 26.04 image the action's default drop-sudo
    # strategy fails ("runner is not a member of the sudo group",
    # https://github.com/openai/codex-action/issues/188). Move back to ubuntu-latest
    # once that is fixed, rather than weakening safety-strategy.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read # PR details and the previous Codex review comment
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Check OPENAI_API_KEY is configured
        env:
          HAS_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if [[ "$HAS_KEY" != "true" ]]; then
            echo "::error title=OPENAI_API_KEY missing::Add an OpenAI API key as the repository secret OPENAI_API_KEY (Settings > Secrets and variables > Actions > New repository secret), then re-run this workflow."
            exit 1
          fi

      # Always read the PR from the API, so a manual run reviews the PR's current
      # head commit, not whatever the event payload held.
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid pull request number '$PR_NUMBER'."
            exit 1
          fi
          if ! gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json" 2> "$RUNNER_TEMP/pr.err"; then
            echo "::error::Pull request #$PR_NUMBER not found in $REPO: $(cat "$RUNNER_TEMP/pr.err")"
            exit 1
          fi
          state=$(jq -r .state "$RUNNER_TEMP/pr.json")
          head_repo=$(jq -r '.head.repo.full_name // ""' "$RUNNER_TEMP/pr.json")
          author=$(jq -r .user.login "$RUNNER_TEMP/pr.json")
          if [[ "$state" != "open" ]]; then
            echo "::error::Pull request #$PR_NUMBER is $state; only open PRs are reviewed."
            exit 1
          fi
          if [[ "$head_repo" != "$REPO" ]]; then
            echo "::error::Pull request #$PR_NUMBER comes from '${head_repo:-a deleted fork}'. Fork PRs are not reviewed, so OPENAI_API_KEY is never used on fork code."
            exit 1
          fi
          if [[ "$author" == "dependabot[bot]" ]]; then
            echo "::error::Dependabot PRs are not reviewed."
            exit 1
          fi
          {
            echo "number=$PR_NUMBER"
            echo "head_sha=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")"
            echo "base_ref=$(jq -r .base.ref "$RUNNER_TEMP/pr.json")"
            echo "base_sha=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")"
          } >> "$GITHUB_OUTPUT"
          jq -r .title "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-title.txt"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.txt"
          echo "Reviewing #$PR_NUMBER ($(jq -r .head.ref "$RUNNER_TEMP/pr.json") @ $(jq -r .head.sha "$RUNNER_TEMP/pr.json"))"

      - uses: actions/checkout@v5
        with:
          # The PR's head commit as resolved above (same repository only).
          ref: ${{ steps.pr.outputs.head_sha }}
          # Full history so Codex can run `git log` / `git diff` between base and head.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR's base branch
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"

      # On a manual re-review, Codex gets its previous review so it can check
      # whether those issues were fixed instead of starting from scratch.
      - name: Fetch previous Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          prev="$RUNNER_TEMP/previous-review.md"
          gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- codex-pr-review -->"))) | .body' \
            > "$prev.all"
          # Keep only the latest one, and skip "review not available" placeholders.
          awk 'BEGIN{RS="<!-- codex-pr-review -->"} NF{last=$0} END{printf "%s", last}' "$prev.all" > "$prev"
          if [[ ! -s "$prev" ]] || head -n 3 "$prev" | grep -q ': not available'; then
            : > "$prev"
            echo "No previous Codex review on this PR; this is a first review."
          else
            echo "Found previous Codex review ($(wc -c < "$prev") bytes):"
            head -n 2 "$prev" | tail -n 1
          fi
          rm -f "$prev.all"

      - name: Build review prompt
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prompt="$RUNNER_TEMP/codex-review-prompt.md"
          src=".github/codex/review-prompt.md"
          # Use the base branch's copy; fall back to the PR's copy only when the base
          # doesn't have one yet.
          if git cat-file -e "origin/$BASE_REF:$src" 2>/dev/null; then
            git show "origin/$BASE_REF:$src" > "$prompt"
          else
            echo "::warning::$src not on $BASE_REF yet; using the PR's copy."
            cat "$src" > "$prompt"
          fi
          {
            echo
            echo "Repository: $REPO, pull request #$PR_NUMBER"
            echo "BASE_SHA: $BASE_SHA"
            echo "HEAD_SHA: $HEAD_SHA"
            echo
            echo "----- BEGIN UNTRUSTED PR TITLE AND DESCRIPTION -----"
            cat "$RUNNER_TEMP/pr-title.txt"
            echo
            cat "$RUNNER_TEMP/pr-body.txt"
            echo
            echo "----- END UNTRUSTED PR TITLE AND DESCRIPTION -----"
            if [[ -s "$RUNNER_TEMP/previous-review.md" ]]; then
              echo
              echo "----- BEGIN 上一次审查 (UNTRUSTED, for re-review context only) -----"
              head -c 30000 "$RUNNER_TEMP/previous-review.md"
              echo
              echo "----- END 上一次审查 -----"
            fi
          } >> "$prompt"
          echo "PROMPT_FILE=$prompt" >> "$GITHUB_ENV"
          echo "Commits under review:"
          git log --oneline "$BASE_SHA..$HEAD_SHA"

      # Must stay the last step of this job (see codex-action docs/security.md).
      - name: Run Codex
        id: run_codex
        # Pinned to the commit behind the v1 tag (2026-10-05): this step holds the API key,
        # so a moved tag must not change what runs. Bump deliberately.
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ env.PROMPT_FILE }}
          # Read-only: Codex can read the checkout and run read-only commands,
          # but cannot write files, use the network, push or merge.
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          model: ${{ vars.CODEX_MODEL }}
          allow-bot-users: ${{ vars.CODEX_ALLOW_BOT_USERS }}

  comment:
    name: Post review comment
    needs: review
    # Runs after a successful or failed review of a PR that passed "Resolve pull
    # request" (open, same-repository). Not when the review was skipped or cancelled,
    # or failed before the PR was validated (missing key, bad number, fork, closed):
    # those are reported in the review job's log only, never on someone's PR.
    if: >-
      always() &&
      (needs.review.result == 'success' || needs.review.result == 'failure') &&
      needs.review.outputs.head_sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Create or update the Codex review comment
        uses: actions/github-script@v7
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          CODEX_FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          TRIGGER: ${{ github.event_name == 'workflow_dispatch' && format('manual re-review by @{0}', github.actor) || 'automatic review of the new PR' }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- codex-pr-review -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issue_number = Number(process.env.PR_NUMBER);
            const sha = (process.env.HEAD_SHA || '').slice(0, 7) || 'unknown commit';
            const message = (process.env.CODEX_FINAL_MESSAGE || '').trim();
            const ok = process.env.REVIEW_RESULT === 'success' && message !== '';
            const { owner, repo } = context.repo;

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`Invalid PR number '${process.env.PR_NUMBER}'.`);
              return;
            }

            let body;
            if (ok) {
              const max = 60000; // GitHub's comment limit is 65536 characters
              const text = message.length > max
                ? message.slice(0, max) + `\n\n…(truncated, full output in the [workflow run](${runUrl}))`
                : message;
              body = `${marker}\n## Codex review of ${sha}\n\n${text}\n\n---\n<sub>${process.env.TRIGGER} · OpenAI Codex · [run log](${runUrl}) · re-review: Actions → Codex PR Review → Run workflow</sub>`;
            } else {
              const why = process.env.REVIEW_RESULT === 'success'
                ? 'Codex finished without producing a review.'
                : 'The Codex review job failed.';
              body = `${marker}\n## Codex review of ${sha}: not available\n\n${why} See the [run log](${runUrl}) for the failing step.`;
              core.error(`${why} ${runUrl}`);
            }

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created comment ${data.html_url}`);
            }
            await core.summary.addRaw(body.replace(marker, '')).write();
            if (!ok) core.setFailed(body.split('\n')[1]);
