# CI for LiveTrans: Python 3.12 backend (FastAPI + faster-whisper) and a static,
# build-free JavaScript frontend. The app targets Windows (install.bat / start.bat),
# so tests run on windows-latest.
#
# What runs, and what deliberately doesn't:
#   Lint       .github/scripts/lint.py: Python + frontend JS syntax, .bat ASCII/CRLF.
#   Build      install the backend dependencies the same way install.bat does.
#   Test       pytest backend/tests (only on branches that contain the test suite).
#   Type check not run: the repository has no type checker configured
#              (no mypy/pyright config, no TypeScript). Add a job here once it has one.
#
# Run the same checks locally:
#   python .github/scripts/lint.py
#   .venv\Scripts\python -m pytest backend\tests

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# One run per PR: a new push cancels the run for the previous commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Static checks
        run: python .github/scripts/lint.py

  build-test:
    name: Build & Test (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*

      # Mirrors install.bat: the pinned requirements.lock when the branch has one,
      # otherwise the version ranges in requirements.txt. A failure here is a
      # dependency/build problem, not a test failure.
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [[ -f backend/requirements.lock ]]; then
            echo "::group::pip install -r backend/requirements.lock"
            python -m pip install -r backend/requirements.lock
          else
            echo "::group::pip install -r backend/requirements.txt"
            python -m pip install -r backend/requirements.txt
          fi
          echo "::endgroup::"
          if [[ -f backend/requirements-dev.txt ]]; then
            echo "::group::pip install -r backend/requirements-dev.txt"
            python -m pip install -r backend/requirements-dev.txt
            echo "::endgroup::"
          fi
          python -m pip check || echo "::warning::pip check reported dependency conflicts (see above)"

      - name: Check the backend imports
        working-directory: backend
        # server.py loads no model at import time; this catches missing or broken dependencies.
        run: python -c "import server; print('backend imports OK')"

      - name: Detect test suite
        id: detect
        run: |
          if compgen -G "backend/tests/test_*.py" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/tests/test_*.py on this branch; tests skipped."
          fi

      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        working-directory: backend
        run: python -m pytest -ra --tb=long --junitxml=../test-results/junit.xml

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Single check to mark as "required" in branch protection, so adding or
  # renaming jobs above doesn't require changing the protection rule.
  ci-result:
    name: CI result
    if: always()
    needs: [lint, build-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          LINT: ${{ needs.lint.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
        run: |
          {
            echo "### CI result"
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Lint | $LINT |"
            echo "| Build & Test | $BUILD_TEST |"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for pair in "Lint=$LINT" "Build & Test=$BUILD_TEST"; do
            name="${pair%%=*}"; result="${pair#*=}"
            if [[ "$result" != "success" ]]; then
              echo "::error::$name finished with '$result'. Open that job's log for the failing step."
              failed=1
            fi
          done
          exit "$failed"
